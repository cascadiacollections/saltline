# Web (HTML5) spike only: flags for the gdext Wasm side module. They apply to
# the wasm32-unknown-emscripten target and nothing else, so desktop and mobile
# builds are untouched. Built with a pinned nightly (`-Z` flags and
# `-Zbuild-std`); see .github/workflows/web-spike.yml. No `-pthread` or
# `+atomics`: this is the no-threads build (gdext `experimental-wasm-nothreads`,
# Godot Web export with Thread Support off).
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sSIDE_MODULE=2",
    "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
    "-Z", "default-visibility=hidden",
    "-Z", "link-native-libraries=no",
]
