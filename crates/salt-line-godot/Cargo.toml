[package]
name = "salt-line-godot"
version = "0.1.0"
edition.workspace = true

[lib]
# `rlib` alongside `cdylib` so the rasteriser, the fonts and the camera maths
# can be unit-tested with `cargo test`. Those parts touch no engine API.
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = "0.5"
salt-line-sim = { path = "../salt-line-sim" }
