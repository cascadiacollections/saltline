[package]
publish = false
name = "salt-line-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately dependency-free. Ask before adding anything here — the crate must
# build and test headless with no engine present.
[dependencies]

[dev-dependencies]
# Benchmarks (benches/sim.rs, `cargo bench -p salt-line-sim`).
divan = "0.1"
insta = "1"
rstest = { version = "0.26", default-features = false }
# Test-only: property tests (tests/properties.rs). The sim itself still has no
# dependencies, so nothing here reaches a build of the game.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "sim"
harness = false
