# Builds the marketing page and publishes it to GitHub Pages.
#
# Every image on the page is regenerated here from art/ by tools/build_site.py,
# so the site can never drift from the game's art pipeline: if a sprite changes
# in a commit, the deployed page changes with it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'art/**'
      - 'tools/gen_sprites.py'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install Pillow
        run: python -m pip install --quiet pillow
      - name: regenerate the site's media from art/
        run: python3 tools/build_site.py
      - name: assets the page needs must exist
        run: |
          set -eu
          for f in index.html style.css main.js assets/hero_wide.png \
                   assets/shot.gif assets/og.png assets/favicon.png \
                   assets/scene_4x.png assets/sprite_sheet_4x.png \
                   assets/palette_16.png assets/sprites/barrel_strip_5deg.png; do
            test -s "site/$f" || { echo "missing site/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
