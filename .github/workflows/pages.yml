# Builds the marketing page and publishes it to GitHub Pages.
#
# Every image on the page is regenerated here from art/ by tools/build_site.py,
# so the site can never drift from the game's art pipeline: if a sprite changes
# in a commit, the deployed page changes with it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'art/**'
      - 'tools/gen_sprites.py'
      - 'tools/build_site.py'
      - 'crates/salt-line-sim/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only by default. Only the deploy job gets to publish (pages, id-token);
# the build job, which runs the generators, never holds write access.
permissions:
  contents: read

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site's base URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - name: install Python tools
        run: uv sync --locked
      - name: regenerate the site's media from art/
        run: uv run python tools/build_site.py
      # The repository's Pages host is not knowable from the source tree (an
      # internal repo gets a randomised *.pages.github.io origin), so the
      # canonical and Open Graph URLs are stamped in from the live base URL.
      - name: stamp the canonical and Open Graph URLs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          base="${BASE_URL%/}/"
          echo "site URL: $base"
          sed -i "s#__SITE_URL__#$base#g" site/index.html
          ! grep -q __SITE_URL__ site/index.html

      - name: assets the page needs must exist
        run: |
          set -eu
          for f in index.html style.css main.js assets/hero_wide.png \
                   assets/shot.gif assets/shot_static.png assets/og.png assets/favicon.png \
                   assets/scene_4x.png assets/sprite_sheet_4x.png \
                   assets/palette_16.png assets/sprites/barrel_strip_5deg.png; do
            test -s "site/$f" || { echo "missing site/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
