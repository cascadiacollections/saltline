name: ci

on:
  # Only main and release tags on push. Without the branch filter a pull
  # request branch runs the whole matrix twice for every commit -- once for
  # push, once for pull_request -- which is pure waste on the macOS and Windows
  # runners. A `vX.Y.Z` tag runs everything and ends in the `release` job.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Superseded runs are not worth paying for; a new push to the same ref makes
# the one in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; artifact upload and download authenticate with the
# run's own runtime token, not with GITHUB_TOKEN. The two exceptions are the
# dev-release job (pushes to main, replaces the `dev` prerelease) and the
# release job (`v*` tags, publishes that version's release); each asks for
# contents: write for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every rust-cache step sets `lookup-only` on tag builds, so a build that
# publishes a release starts from nothing cached (zizmor cache-poisoning).
# PR caches are scoped to refs/pull/N/merge and a tag run can only restore
# main's, so the exposure is whatever reached main's cache; a release is not
# worth even that. Tag builds are cold and slower, and clean.

jobs:
  # The sim crate must build and test with no engine present, on every
  # platform we ship to.
  sim:
    name: sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The arm64 runners are here because arm64 is shipped (Android,
        # Windows on ARM, Apple silicon via macos-latest), so its digest has to
        # join the comparison below. Hosted arm64 runners are not offered to
        # private and internal repositories on every plan; if a label is not
        # available to this repo its job sits queued rather than failing. If
        # that happens, drop the label here and the count in `determinism`.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - name: test salt-line-sim (headless, no Godot installed)
        run: cargo nextest run -p salt-line-sim --profile ci
      - name: test salt-line-godot (rasteriser, fonts, camera maths)
        run: cargo nextest run -p salt-line-godot --profile ci
      - name: doctests
        run: cargo test --doc --workspace
      - name: build the GDExtension
        run: cargo build -p salt-line-godot
      - name: determinism digest
        shell: bash
        run: |
          cargo run --release -q -p salt-line-sim --bin determinism | tee digest.txt
          grep -oE 'digest: 0x[0-9a-f]+' digest.txt | cut -d' ' -f2 > digest-${{ matrix.os }}.txt
          cat digest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt

  # DESIGN §3: same seed plus same input sequence produces a byte-identical
  # final state on every platform. If these digests diverge, stop and fix the
  # determinism leak — do not paper over it with tolerances.
  determinism:
    name: determinism across platforms
    needs: sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
      - name: compare digests
        run: |
          set -eu
          ls -l
          found=0
          for f in digest-*.txt; do
            printf '%-28s %s\n' "$f" "$(cat "$f")"
            found=$((found + 1))
          done
          # One per `sim` matrix entry; keep in step with that list.
          expected=5
          if [ "$found" -ne "$expected" ]; then
            echo "expected $expected platform digests, got $found" >&2
            exit 1
          fi
          if [ "$(cat digest-*.txt | sort -u | wc -l)" -ne 1 ]; then
            echo "DETERMINISM LEAK: platform digests differ" >&2
            exit 1
          fi
          echo "all platforms agree: $(cat digest-ubuntu-latest.txt)"

  # Every place the version is written down agrees (RELEASING.md, "Version
  # rule"), on every run so drift is caught in review. On a `v*` tag the tag
  # must match as well and CHANGELOG.md must have that version's section,
  # which becomes the release notes; a mismatched tag publishes nothing.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so a tag build can check its commit is on main.
          fetch-depth: 0
      # python3 on the runner is enough: the script needs only Python 3.9+.
      - name: check versions
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          if [ "$IS_TAG" = "true" ]; then
            python3 tools/release_version.py check --tag "$GITHUB_REF_NAME"
            # Releases are cut from main only, never from a side branch.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "tag $GITHUB_REF_NAME points at ${GITHUB_SHA::7}, which is not on main" >&2
              exit 1
            fi
          else
            python3 tools/release_version.py check
          fi

  # Brief M2 acceptance: every screen the generator can produce is solvable.
  solvability:
    name: batch solvability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: 5,000 screens across 50 seeds
        run: cargo run --release -q -p salt-line-sim --bin batch
      - name: each intended build shape
        run: |
          set -eu
          for build in base drift demo precision risk; do
            cargo run --release -q -p salt-line-sim --bin batch -- \
              --seeds 20 --screens 60 --build "$build" | tail -3
          done

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The opt-in profiling build is compiled nowhere else; lint it so it can't rot.
      - run: cargo clippy -p salt-line-godot --all-targets --features profiling -- -D warnings
      - name: the sim crate must stay dependency-free
        run: |
          set -eu
          # DESIGN §6 and the brief: salt-line-sim depends on nothing. If this
          # ever needs to change it is a conversation, not a commit.
          deps=$(cargo tree -p salt-line-sim --edges normal --prefix none \
                 | grep -v '^salt-line-sim' | sort -u || true)
          if [ -n "$deps" ]; then
            echo "salt-line-sim grew dependencies:" >&2
            echo "$deps" >&2
            exit 1
          fi
          echo "salt-line-sim has no dependencies"



  # Cheap checks on everything that is not Rust logic: spelling (typos),
  # workflow security (zizmor) and declared-but-unused dependencies (machete).
  hygiene:
    name: typos + zizmor + machete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
      - name: workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-machete
      - name: unused dependencies
        run: cargo machete

  # Line coverage, written to the job summary. Informational: no threshold and
  # no upload to a coverage service, in keeping with no telemetry.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          key: coverage
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: coverage
        run: |
          set -eu
          cargo llvm-cov nextest --workspace --profile ci --summary-only --ignore-filename-regex '/bin/' | tee coverage.txt
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Miri interprets the tests and fails on undefined behaviour. The code has
  # almost no unsafe today, so this is future-proofing: it covers the pure
  # modules (trig, RNG, save format, touch, aim, icons), because the whole sim
  # suite takes far too long interpreted. Snapshot tests opt out (insta uses a
  # socket Miri cannot emulate).
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          key: miri
      - name: miri
        env:
          PROPTEST_CASES: "4"
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p salt-line-sim --lib -- dmath:: rng::
          cargo +nightly miri test -p salt-line-godot --lib -- save_format:: touch:: aim:: icons::

  # Advisories, licences, bans and sources for the whole dependency tree
  # (deny.toml). A new RustSec advisory can turn this red with no change here;
  # that is the point, and the fix is usually a Dependabot bump.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  playable:
    name: playable (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    # Tag builds are cold (no cache) and may wait on Apple's notary service.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 75 || 40 }}
    # Tag builds run in the `release` environment, which holds the Apple
    # signing secrets and admits only main and v* tags (RELEASING.md, "Owner
    # action required"). An empty name means no environment at all.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: Linux
            output: SaltLine.x86_64
          - os: macos-latest
            preset: macOS
            output: SaltLine.app
          - os: windows-latest
            preset: Windows Desktop
            output: SaltLine.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v1 hard-links the macOS binary out of its .app bundle, and the kernel
      # SIGKILLs anything run through that link (Killed: 9, exit 137). Fixed in
      # v2.3.0 by using a real symlink.
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')
        id: portal-cache
        with:
          path: |
            addons/xdg_portals/bin
            addons/xdg_portals/xdg_portals.gdextension
          key: xdg-portals-ubuntu-24.04-${{ hashFiles('tools/build_xdg_portals.sh', 'tools/xdg_portals_linux.gdextension.in') }}
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: build the Linux desktop portal bridge
        if: runner.os == 'Linux' && steps.portal-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake pkg-config libglib2.0-dev
          bash tools/build_xdg_portals.sh editor template_release
      - name: build the release GDExtension
        if: runner.os != 'macOS'
        run: cargo build --release -p salt-line-godot
      # The macOS export ships one universal dylib (arm64 + x86_64), which is
      # what `macos.release` in salt_line.gdextension points at; `just
      # macos-universal` is the same thing on a Mac. Debug builds stay
      # host-only at target/debug, so local development is unchanged.
      - name: build the universal macOS GDExtension
        if: runner.os == 'macOS'
        run: |
          set -eu
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p salt-line-godot --target aarch64-apple-darwin
          cargo build --release -p salt-line-godot --target x86_64-apple-darwin
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/libsalt_line_godot.dylib" \
            target/aarch64-apple-darwin/release/libsalt_line_godot.dylib \
            target/x86_64-apple-darwin/release/libsalt_line_godot.dylib
          lipo -info "$out/libsalt_line_godot.dylib"
          lipo "$out/libsalt_line_godot.dylib" -verify_arch arm64 x86_64
      # The editor that drives --import and --export-release is itself a debug
      # context, so it resolves the `*.debug` entries in salt_line.gdextension
      # and only the release profile is built here. Staging a copy at the debug
      # path costs nothing and turns "extension silently failed to load" into a
      # condition CI can actually see.
      - name: stage the GDExtension for the editor
        shell: bash
        run: |
          set -eu
          mkdir -p target/debug
          for f in target/release/*salt_line_godot.so \
                   target/universal-apple-darwin/release/libsalt_line_godot.dylib \
                   target/release/salt_line_godot.dll; do
            if [ -e "$f" ]; then cp "$f" "target/debug/$(basename "$f")"; fi
          done
          ls -l target/debug
      - name: create output directory
        run: mkdir -p build
      # The Windows build ships a GUI-subsystem godot.exe: it detaches from the
      # console, prints nothing, and returns 0 immediately no matter what it
      # was asked to do. That is why this job used to "export successfully" and
      # upload an empty artifact. The console wrapper beside it is the one that
      # waits and reports a real exit code; it locates its partner by filename,
      # so it has to be run from where it was unpacked.
      - name: find a Godot that actually runs
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            main=$(find "$HOME/godot" -maxdepth 3 -name 'Godot_v*_win64.exe' \
                   ! -name '*_console.exe' | head -1)
            if [ -z "$main" ]; then
              echo "no unpacked Godot found under $HOME/godot" >&2
              ls -R "$HOME/godot" >&2 || true
              exit 1
            fi
            console="${main%.exe}_console.exe"
            # The console wrapper is not restored on a tool-cache hit, so fall
            # back rather than fail — the output checks below are the real gate.
            if [ -f "$console" ]; then bin="$console"; else bin="$main"; fi
          else
            bin=godot
          fi
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version
      - name: import assets
        # A clean checkout has no .godot/ cache, so the PNGs are still PNGs.
        # Exporting without importing first ships an artifact with no art in
        # it — which exports successfully and then launches wrong.
        #
        # godotengine/godot#111048: the editor can quit before a deferred
        # GDExtension doc update runs and crash (signal 11, exit 139) after the
        # work is done. --frame-delay only narrowed that window; Windows still
        # crashed with it. tools/godot_headless.sh removes the triggers. Drop
        # both once the pinned Godot has the fix.
        shell: bash
        run: |
          bash tools/godot_headless.sh --frame-delay 800 --import
      - name: export playable binary
        shell: bash
        run: |
          set -eu
          bash tools/godot_headless.sh --export-release \
            "${{ matrix.preset }}" "build/${{ matrix.output }}"
          # `--export-release` has been known to exit 0 having written nothing,
          # so the file is the gate, not the exit code.
          if [ ! -e "build/${{ matrix.output }}" ]; then
            echo "the export reported success but produced no artifact" >&2
            ls -lR build >&2
            exit 1
          fi
      # The export copies whatever `macos.release` points at into the bundle;
      # check that what shipped really is universal.
      - name: the macOS bundle carries a universal extension
        if: runner.os == 'macOS'
        run: |
          set -eu
          lib=$(find build/SaltLine.app/Contents -name '*salt_line_godot*.dylib' | head -1)
          if [ -z "$lib" ]; then
            echo "no GDExtension inside the exported bundle" >&2
            find build/SaltLine.app >&2
            exit 1
          fi
          lipo -info "$lib"
          lipo "$lib" -verify_arch arm64 x86_64
          lipo -info "$(find build/SaltLine.app/Contents/MacOS -maxdepth 1 -type f | head -1)"

      # Developer ID signing and notarization, for tag builds only and only when
      # every Apple secret is set (RELEASING.md, "Owner action required").
      # Without them the app ships unsigned, as the preview always has.
      - name: macOS signing credentials
        id: apple
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$NOTARY_KEY" ] \
             && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are not all set; the macOS build is unsigned and un-notarized"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
      - name: sign the macOS app (Developer ID, hardened runtime)
        if: steps.apple.outputs.sign == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          set -eu
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" \
                     | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "APPLE_DEVELOPER_ID_P12 holds no Developer ID Application identity" >&2
            exit 1
          fi
          app=build/SaltLine.app
          # Inside out: nested code first, then the bundle.
          find "$app/Contents" -name '*.dylib' -print0 | while IFS= read -r -d '' lib; do
            codesign --force --timestamp --options runtime --sign "$identity" "$lib"
          done
          codesign --force --timestamp --options runtime --sign "$identity" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"

      # Exporting successfully is not the same as being playable. Launch the
      # artifact itself — not the editor, not `cargo run` — and make it render
      # a real screen and write the PNG out. This is what catches a missing
      # GDExtension, an unimported sprite, or a crash on startup.
      - name: smoke launch the exported artifact
        shell: bash
        run: |
          set -eu
          exe="build/${{ matrix.output }}"
          if [ -d "$exe" ]; then
            # macOS exports a bundle; the executable inside it is named by the
            # preset, so find it rather than guess at it.
            exe=$(find "$exe/Contents/MacOS" -maxdepth 1 -type f | head -1)
          fi
          if [ ! -e "$exe" ]; then
            echo "no executable inside the exported artifact:" >&2
            ls -lR build >&2
            exit 1
          fi
          chmod +x "$exe" 2>/dev/null || true
          rm -f smoke.png
          # Since Godot 4.7 an exported build no longer writes a relative path
          # under the directory it was started from, so pass it absolute. `pwd -W`
          # gives the Windows form (D:/...) the engine expects there.
          shot="$(pwd -W 2>/dev/null || pwd)/smoke.png"
          extra=""
          if [ "${{ runner.os }}" = "Linux" ]; then extra=--salt-require-portals; fi

          # An exported Windows binary is GUI-subsystem too, so it detaches and
          # hands back 0 the moment it is started. Waiting on the rendered file
          # rather than the exit code is the one check that means the same
          # thing on all three platforms: it launched, and it drew a screen.
          "$exe" --headless -- \
            --salt-seed 20260907 --salt-screen 12 \
            --salt-shot "$shot" --salt-shot-at 0.5 ${extra:+$extra} &
          launcher=$!
          for _ in $(seq 1 60); do
            if [ -s smoke.png ]; then break; fi
            # If it died without rendering, stop waiting and fail fast rather
            # than burning the whole budget on a process that is already gone.
            if ! kill -0 "$launcher" 2>/dev/null; then break; fi
            sleep 1
          done
          # Never block on the launcher: a build whose extension fails to load
          # boots an empty scene and runs forever, which used to hang the job
          # until the 6 hour default timeout. Shut it down on our terms.
          kill "$launcher" 2>/dev/null || true
          sleep 2
          kill -9 "$launcher" 2>/dev/null || true
          wait "$launcher" 2>/dev/null || true

          if [ ! -s smoke.png ]; then
            echo "the exported build never rendered a frame" >&2
            exit 1
          fi
          # Guard against catching a half-written file: it must be a real PNG.
          if [ "$(head -c 4 smoke.png | od -An -tx1 | tr -d ' \n')" != "89504e47" ]; then
            echo "smoke.png is not a PNG" >&2
            exit 1
          fi
          echo "launched and rendered $(wc -c < smoke.png) bytes"
      # After the smoke test, so a build that cannot launch is never sent to
      # Apple; before the checksum, because stapling changes the bundle.
      - name: notarize and staple the macOS app
        if: steps.apple.outputs.sign == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -eu
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          ditto -c -k --keepParent build/SaltLine.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" >&2 || true
            echo "notarization finished as '$status'" >&2
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple build/SaltLine.app
          xcrun stapler validate build/SaltLine.app
          spctl --assess --type execute --verbose=2 build/SaltLine.app
      - name: remove the signing keychain
        if: always() && steps.apple.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: checksum
        shell: bash
        run: |
          set -eu
          cd build
          if command -v sha256sum >/dev/null; then
            sha256sum -- "${{ matrix.output }}" > "${{ matrix.output }}.sha256" 2>/dev/null || \
              find "${{ matrix.output }}" -type f -exec sha256sum {} + > "${{ matrix.output }}.sha256"
          else
            shasum -a 256 -- "${{ matrix.output }}" > "${{ matrix.output }}.sha256" 2>/dev/null || \
              find "${{ matrix.output }}" -type f -exec shasum -a 256 {} + > "${{ matrix.output }}.sha256"
          fi
          cat "${{ matrix.output }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salt-line-${{ matrix.preset }}
          # An empty upload used to pass this job silently. Never again.
          if-no-files-found: error
          path: |
            build/${{ matrix.output }}
            build/${{ matrix.output }}.sha256
      - name: the smoke frame, for eyeballing a failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.preset }}
          path: smoke.png
          if-no-files-found: warn
      # One zip per platform for the dev and tagged releases. `ditto` keeps the macOS
      # bundle's symlinks and permissions, and zip keeps the Linux binary's +x;
      # a plain artifact upload keeps neither.
      - name: package for release
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent "build/${{ matrix.output }}" dist/SaltLine-macos.zip ;;
            Windows) 7z a -tzip dist/SaltLine-windows-x86_64.zip "./build/${{ matrix.output }}" > /dev/null ;;
            Linux) (cd build && zip -q ../dist/SaltLine-linux-x86_64.zip "${{ matrix.output }}") ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.preset }}
          path: dist/*
          if-no-files-found: error

  # A release-optimised APK for sideloading. Pushes to main (dev builds) and
  # v* tags are signed with the release key when its three secrets are set in
  # the `release` environment, so dev builds and releases install over each
  # other in versionCode order; without them they fall back to the debug key
  # with a warning. Pull requests always use the debug key: the
  # ANDROID_DEBUG_KEYSTORE secret (base64) when set, the same key as a local
  # `just android`, else a throwaway key made per run.
  # The versionCode is written into the preset per build (RELEASING.md,
  # "Android versionCode").
  android:
    name: android (arm64)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Pushes to main and v* tags run in the `release` environment, which holds
    # the Android release key; pull requests never do, and stay on the debug
    # key. An empty name means no environment at all.
    environment: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          key: android
      - name: build the GDExtension for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cargo build --release -p salt-line-godot --target aarch64-linux-android \
            --config "target.aarch64-linux-android.linker=\"$bin/aarch64-linux-android24-clang\""
          "$bin/llvm-strip" --strip-debug target/aarch64-linux-android/release/libsalt_line_godot.so
      # Godot's CLI cannot override version/code, so the preset is edited in
      # place in this throwaway checkout. Tags get the version's release slot;
      # everything else gets the run number, below it (RELEASING.md).
      - name: versionCode
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          tool=tools/release_version.py
          if [ "$IS_TAG" = "true" ]; then
            code=$(python3 "$tool" android-code --run "$RUN_NUMBER" --release)
            python3 "$tool" set-android --code "$code"
          else
            code=$(python3 "$tool" android-code --run "$RUN_NUMBER")
            base=$(python3 "$tool" version)
            python3 "$tool" set-android --code "$code" --name "$base-dev.$RUN_NUMBER"
          fi
      - name: signing key
        id: key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          # Only main pushes and tags ask for the release key, and only they run
          # in the `release` environment that holds it.
          RELEASE_KEYSTORE_B64: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && secrets.ANDROID_RELEASE_KEYSTORE || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
          WANT_RELEASE_KEY: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -eu
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$ks"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "signing with the release key"
            exit 0
          fi
          if [ "$WANT_RELEASE_KEY" = "true" ]; then
            echo "::warning::ANDROID_RELEASE_KEYSTORE, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS are not all set in the release environment; this APK is signed with the debug key and will not install over a release-signed build"
          fi
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; signing with a throwaway key"
            keytool -genkeypair -keystore "$ks" -alias androiddebugkey -storepass android \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
          } >> "$GITHUB_ENV"
          echo "mode=debug" >> "$GITHUB_OUTPUT"
      # The editor loads the host library, not the Android one. Without it the
      # extension fails to load at startup and import hits godotengine/godot#111048
      # (see tools/godot_headless.sh).
      - name: build the GDExtension for the editor
        run: cargo build -p salt-line-godot
      - name: import assets
        run: bash tools/godot_headless.sh --frame-delay 800 --import
      - name: export the APK
        env:
          # Kept out of GITHUB_ENV so the password lives only in this step.
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || 'android' }}
        run: |
          set -eu
          # Godot takes the SDK from ANDROID_HOME and the JDK from JAVA_HOME.
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          mkdir -p build dist
          bash tools/godot_headless.sh --export-release "Android" build/SaltLine.apk
          test -s build/SaltLine.apk
          cp build/SaltLine.apk dist/SaltLine-android-arm64.apk
          ls -l dist
      # The certificate digest is what decides whether this APK installs over
      # an existing one; print it so a key mix-up is visible in the log.
      - name: signing certificate and version
        run: |
          set -eu
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs dist/SaltLine-android-arm64.apk
          "$tools/aapt2" dump badging dist/SaltLine-android-arm64.apk | head -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # iOS can only be signed with a developer account, so CI stops short of that: it
  # builds the extension, exports the Xcode project with a placeholder team, and
  # builds the app unsigned. That still proves the export and the link, which is
  # everything `just ios` does before signing.
  ios:
    name: ios (arm64, unsigned)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: build the host and iOS GDExtensions
        run: |
          # Godot loads the host library while importing a clean checkout. Without
          # it the export can succeed after failing to instantiate the main scene.
          cargo build -p salt-line-godot
          rustup target add aarch64-apple-ios
          cargo build -p salt-line-godot --target aarch64-apple-ios
      - name: import assets
        run: bash tools/godot_headless.sh --frame-delay 800 --import
      - name: export the Xcode project
        run: |
          set -eu
          sed -i '' 's/^application\/app_store_team_id=".*"$/application\/app_store_team_id="ABCDE12345"/' export_presets.cfg
          mkdir -p build/ios
          bash tools/godot_headless.sh --export-debug "iOS" build/ios/SaltLine.ipa
          test -d build/ios/SaltLine.xcodeproj
          info=build/ios/SaltLine/SaltLine-Info.plist
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            plutil -remove "$key" "$info" 2>/dev/null || true
          done
          sed -i '' '/^#pragma once$/d' build/ios/SaltLine/dummy.h
          # A missing extension library is skipped silently, so check it was wrapped.
          find build/ios -name 'libsalt_line_godot.framework' | grep -q .
      - name: build the app, unsigned
        run: |
          set -eu
          xcodebuild -project build/ios/SaltLine.xcodeproj -configuration Debug -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build/ios/out" -quiet build
          app=$(ls -d build/ios/out/Debug-iphoneos/*.app | head -1)
          echo "built $app"
          find "$app" -maxdepth 3 \( -name '*salt_line*' -o -name '*.pck' \) | tee found.txt
          grep -q salt_line found.txt

  # Native build for Windows on ARM (e.g. Snapdragon laptops), cross-compiled on
  # the x64 runner and exported with Godot's arm64 template. It cannot be
  # launched here, so unlike the playable jobs there is no smoke test.
  windows-arm64:
    name: windows (arm64, cross-built)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          key: windows-arm64
      - name: build the GDExtension for both architectures
        shell: bash
        run: |
          set -eu
          rustup target add aarch64-pc-windows-msvc
          cargo build --release -p salt-line-godot --target aarch64-pc-windows-msvc
          # The editor that runs the export is x64 and loads the extension
          # itself (see the playable job), so it needs its own build as well.
          cargo build --release -p salt-line-godot
          mkdir -p target/debug
          cp target/release/salt_line_godot.dll target/debug/
      - name: find a Godot that actually runs
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            main=$(find "$HOME/godot" -maxdepth 3 -name 'Godot_v*_win64.exe' \
                   ! -name '*_console.exe' | head -1)
            if [ -z "$main" ]; then
              echo "no unpacked Godot found under $HOME/godot" >&2
              ls -R "$HOME/godot" >&2 || true
              exit 1
            fi
            console="${main%.exe}_console.exe"
            # The console wrapper is not restored on a tool-cache hit, so fall
            # back rather than fail — the output checks below are the real gate.
            if [ -f "$console" ]; then bin="$console"; else bin="$main"; fi
          else
            bin=godot
          fi
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version
      - name: import assets
        shell: bash
        run: |
          bash tools/godot_headless.sh --import
      - name: export the arm64 binary
        shell: bash
        run: |
          set -eu
          mkdir -p build dist
          bash tools/godot_headless.sh --export-release "Windows Desktop ARM64" build/SaltLine-arm64.exe
          test -s build/SaltLine-arm64.exe
          7z a -tzip dist/SaltLine-windows-arm64.zip ./build/SaltLine-arm64.exe > /dev/null
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-arm64
          path: dist/*
          if-no-files-found: error

  # Replaces the `dev` prerelease with this commit's builds, so the latest main
  # is one download away on any device. Only after every check has passed.
  dev-release:
    name: dev release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, determinism, solvability, lint, playable, android, windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -l
          short="${GITHUB_SHA::7}"
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create dev ./* \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Development build ($short)" \
            --notes "Latest main, built from $short. Unsigned desktop builds and an Android APK, for testing only (see RELEASING.md for how it is signed)."

  # A `vX.Y.Z` tag publishes release vX.Y.Z: the same downloads as the dev
  # build, as a normal (not pre-) release, with that version's CHANGELOG.md
  # section as its notes. Only after every check has passed, including the
  # version gate, which fails when the tag does not match the version in the
  # tree. The tag itself is pushed by a human (RELEASING.md).
  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, determinism, solvability, lint, deny, playable, android, windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            tools/release_version.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          python3 tools/release_version.py notes "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo '---'
            echo
            echo "Built from ${GITHUB_SHA::7}. Verify downloads against SHA256SUMS; RELEASING.md says which builds are signed."
          } >> "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -l
          gh release create "$tag" ./* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Salt Line $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
