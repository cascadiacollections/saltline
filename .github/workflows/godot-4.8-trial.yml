name: godot-4.8-trial

# Opt-in preview. workflow_dispatch only, so pull requests and release tags
# never wait on it and it is not one of the 4.7.2 required checks.
# Do not set GODOT_VERSION here. tools/godot_template.py key() fails if that
# variable disagrees with the 4.7.2 pin. The trial uses GODOT_TEMPLATE_VERSION
# inside its own export step.

on:
  workflow_dispatch:
    inputs:
      custom_engine:
        description: "Also build a stripped 4.8-beta2 Android arm64 template (Python >= 3.10). Allow-failure. Does not publish or edit the 4.7.2 lock."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: official 4.8-beta2 vs 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: editor libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libxi-dev libxrandr-dev libasound2-dev libpulse-dev libudev-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: trial unit tests
        run: python3 -m unittest discover -s tools -p test_godot_4_8_trial.py -v
      - name: host GDExtension
        run: |
          cargo build --release -p salt-line-godot
          mkdir -p target/debug
          cp target/release/libsalt_line_godot.so target/debug/
      - name: Android arm64 GDExtension
        run: |
          set -eu
          rustup target add aarch64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cargo build --release -p salt-line-godot --target aarch64-linux-android \
            --config "target.aarch64-linux-android.linker=\"$bin/aarch64-linux-android24-clang\""
          "$bin/llvm-strip" --strip-debug target/aarch64-linux-android/release/libsalt_line_godot.so
      - name: export both official templates and compare
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python3 tools/godot_4_8_trial.py run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: godot-4.8-trial-report
          path: build/godot-4.8-trial/
          if-no-files-found: warn

  # Separate from the export job so a long or failed engine compile does not
  # hide the official-template comparison. Nothing here publishes a release
  # or writes tools/godot_templates.lock.json.
  custom-engine:
    name: stripped 4.8-beta2 engine
    if: ${{ inputs.custom_engine }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Python >= 3.10 for this trial build only
        run: python3 tools/godot_4_8_trial.py check-python
      - name: build the stripped Android arm64 template
        run: python3 tools/godot_4_8_trial.py build android
      - name: check build key, commit and digest
        run: python3 tools/godot_4_8_trial.py validate-build build/godot-4.8-trial-engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: godot-4.8-trial-engine
          path: build/godot-4.8-trial-engine/
          if-no-files-found: warn
