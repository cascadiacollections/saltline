version: 2
# Every ecosystem waits 7 days before proposing a new release: hijacked
# releases are usually caught and yanked within days, and nothing here is
# urgent enough to need an update sooner. Security updates are not delayed.
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # salt-line-sim has no dependencies by design; this only ever touches the Godot crate's tree.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The `api-4-7` feature ties the bindings to the engine version (README, salt_line.gdextension).
      # A new major is an engine upgrade decision, not a dependency bump.
      - dependency-name: godot
        update-types: ["version-update:semver-major"]

  # The asset and site generators (tools/*.py).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # First match wins. ty is 0.0.x and most releases change its diagnostics,
      # so it is kept out of the weekly group a Pillow bump may ride in.
      ty:
        patterns: ["ty"]
      python:
        patterns: ["*"]
