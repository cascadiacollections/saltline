version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # salt-line-sim has no dependencies by design; this only ever touches the Godot crate's tree.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # The `api-4-4` feature ties the bindings to the engine version (README, salt_line.gdextension).
      # A new major is an engine upgrade decision, not a dependency bump.
      - dependency-name: godot
        update-types: ["version-update:semver-major"]

  # The asset and site generators (tools/*.py).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
