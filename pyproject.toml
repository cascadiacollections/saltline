[project]
name = "salt-line-tools"
version = "0.1.0"
description = "Asset and marketing-site generators for Salt Line"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=13.0",
]

[tool.ty.environment]
# gameoff/tools/ imports the engine's sprite helpers from tools/.
extra-paths = ["tools"]

[tool.ty.analysis]
# blender/scripts run inside Blender, which provides these modules.
# gameoff/tools/web_smoke.py runs in CI after `pip install playwright`.
allowed-unresolved-imports = ["bpy", "mathutils", "playwright.**"]

[tool.uv]
# A range, not an exact pin: Dependabot runs its own uv (0.13.5 when this was
# written) and refuses to update anything when required-version excludes it.
# mise.toml and CI still pin the exact version.
required-version = ">=0.13.5,<0.14"
package = false

# Not "dev": uv installs that group by default, and the Pages deploy, the
# devcontainer and the Justfile recipes have no use for a type checker.
[dependency-groups]
lint = [
    "ty>=0.0.91",
]
