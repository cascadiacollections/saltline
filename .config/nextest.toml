# cargo-nextest (https://nexte.st). `cargo nextest run` locally; CI uses the
# ci profile. nextest does not run doctests, so CI runs `cargo test --doc` too.

[profile.ci]
# Report every failure in one run rather than stopping at the first.
fail-fast = false
# Flag a test as slow after a minute and kill it after five, so a hang fails
# the job with a name attached instead of timing the runner out.
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"
