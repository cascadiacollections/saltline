[workspace]
resolver = "2"
members = ["crates/salt-line-sim", "crates/salt-line-godot"]
# Fuzzing lives in its own workspace (fuzz/Cargo.toml) and needs nightly.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cascadiacollections/saltline"

[profile.release]
lto = true
codegen-units = 1
